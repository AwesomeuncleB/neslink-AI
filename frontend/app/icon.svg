<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16273e"/>
      <stop offset="100%" stop-color="#0f1d33"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3d082"/>
      <stop offset="100%" stop-color="#d3a856"/>
    </linearGradient>
  </defs>

  <!-- Base Rounded Navy Tile -->
  <rect width="64" height="64" rx="14" fill="url(#tileBg)"/>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="#d3a856" stroke-width="1.8" stroke-opacity="0.35"/>

  <!-- Serif Monogram "N" in Gold -->
  <path d="M 18,45 V 19 M 18,19 L 43,45 M 43,19 V 45" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Serif horizontal brackets/serif feet -->
  <path d="M 14,19 H 22 M 14,45 H 22 M 39,19 H 47 M 39,45 H 47" 
        stroke="url(#goldGrad)" 
        stroke-width="2.5" 
        stroke-linecap="round"/>

  <!-- AI Spark / Crimson Wax Accent Dot -->
  <circle cx="50" cy="15" r="4" fill="#8c2a3b"/>
  <circle cx="50" cy="15" r="2.2" fill="#d3a856"/>
</svg>
