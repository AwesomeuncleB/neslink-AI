<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Marginalia AI</title>
<meta name="description" content="Sign in to Marginalia AI to access your essay reviews and track your progress.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Petrona:wght@500;600;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script src="{{ url_for('static', filename='theme.js') }}"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  window.SUPABASE_CONFIG = {
    url: "{{ supabase_url }}",
    anonKey: "{{ supabase_anon_key }}"
  };
</script>
</head>
<body>

<header class="navbar">
  <div class="navbar-inner">
    <a href="/" class="brand-title">Marginalia AI</a>
    <div class="nav-actions">
      <a href="/" class="nav-back-link">← Home</a>
      <button class="theme-toggle-btn" aria-label="Toggle theme">☀️ Light</button>
    </div>
  </div>
</header>

<main class="auth-wrapper">
  <div class="auth-card">

    <div class="auth-header">
      <h1>Welcome Back</h1>
      <p>Sign in to access your essay reviews.</p>
    </div>

    <div class="auth-notice error-notice" id="auth-error" hidden></div>
    <div class="auth-notice success-notice" id="auth-success" hidden></div>

    <!-- SIGN IN FORM -->
    <form class="auth-form" id="form-login" novalidate>
      <div class="auth-field">
        <label for="login-email">Email Address</label>
        <input type="email" id="login-email" required placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="auth-field">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" required placeholder="••••••••" autocomplete="current-password">
      </div>
      <button type="submit" class="btn-auth-submit" id="login-submit-btn">Sign In</button>
      <p class="auth-footer-text">
        No account? <a href="/signup">Create one here →</a>
      </p>
    </form>

  </div>
</main>

<script src="{{ url_for('static', filename='auth.js') }}"></script>
</body>
</html>
